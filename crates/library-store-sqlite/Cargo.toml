[package]
name = "library-store-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
library-domain = { path = "../library-domain" }
rusqlite = { version = "0.39.0", features = ["bundled", "hooks", "trace"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
blake3 = "1.8.5"
sha2 = "0.11.0"
symphonia = { version = "0.6.0", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2.0.18"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
