[package]
name = "library-boundary-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
library-boundary-protocol = { path = "../library-boundary-protocol" }
library-domain = { path = "../library-domain" }
library-store-sqlite = { path = "../library-store-sqlite" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[dev-dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
